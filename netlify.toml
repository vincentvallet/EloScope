[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.13.0"
  NITRO_PRESET = "netlify"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions."ffe-catalog-sync"]
  schedule = "17 2 * * *"

[functions."ffe-catalog-sync-worker"]
  background = true

[functions."ffe-catalog-announcements"]
  schedule = "47 3 * * *"

[functions."ffe-catalog-announcements-worker"]
  background = true

[functions."ffe-history-backfill"]
  schedule = "*/10 * * * *"

[functions."ffe-history-backfill-worker"]
  background = true

[functions."ffe-player-participations"]
  schedule = "3,13,23,33,43,53 * * * *"

[functions."ffe-player-participations-worker"]
  background = true
